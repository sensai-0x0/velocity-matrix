[package]
name = "bputil-eval"
version = "0.1.0"
edition = "2024"
description = "Boot-policy evaluation and owner-authorised unlock tool for Apple Silicon Macs"
license = "MIT"

[[bin]]
name = "bputil-eval"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "2.0.3"
sha2 = "0.10.8"
hex = "0.4.3"
time = { version = "0.3.36", features = ["serde", "formatting", "parsing"] }
image4 = { version = "0.8.2", features = ["manifest", "alloc"] }
der = "0.7"

[dev-dependencies]
tempfile = "3.13.0"

[profile.release]
lto = true
strip = true
