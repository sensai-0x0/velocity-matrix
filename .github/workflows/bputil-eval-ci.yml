name: bputil-eval CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'the-ant-experiment/**'
      - '.github/workflows/bputil-eval-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'the-ant-experiment/**'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite (macOS)
    # This tool is Apple-Silicon-specific (evaluate shells out to bputil/csrutil/ioreg/
    # diskutil, none of which exist on Linux), so CI must run on a real macOS runner, not
    # ubuntu-latest like this repo's other Rust project (shadow-agent-ci.yml).
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            the-ant-experiment/target/
          key: ${{ runner.os }}-bputil-eval-cargo-${{ hashFiles('the-ant-experiment/Cargo.lock') }}

      - name: Run tests
        working-directory: ./the-ant-experiment
        run: cargo test --verbose

  lint:
    name: Linting
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            the-ant-experiment/target/
          key: ${{ runner.os }}-bputil-eval-cargo-${{ hashFiles('the-ant-experiment/Cargo.lock') }}

      - name: Check formatting
        working-directory: ./the-ant-experiment
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ./the-ant-experiment
        run: cargo clippy --all-targets -- -D warnings

  guards:
    name: Safety guards (P0 exit gate)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: No subprocess outside the audited wrapper; no credential-shaped field
        working-directory: ./the-ant-experiment
        run: ./scripts/ci_guards.sh
